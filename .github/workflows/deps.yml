# tgbot — 预编译 vcpkg 依赖
#
# 触发时机：
#   - push 到 main（vcpkg.json 或本工作流变化时）
#   - 每日定时（检查 microsoft/vcpkg 上游，有更新即重编）
#   - 手动
# 产物发布到 tag `deps` 的 rolling release：
#   - vcpkg-bincache-<triplet>.tar.gz  预编译的 vcpkg binary cache
#   - vcpkg-commit.txt                 编译所用的 vcpkg commit（下游必须检出同一 commit）

name: Deps

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'   # 每天 03:23 UTC 检查上游
  workflow_dispatch:

env:
  # Alpine(musl) 上 vcpkg 官方 cmake 是 glibc 预编译版跑不了，强制用系统工具链
  VCPKG_FORCE_SYSTEM_BINARIES: "1"

permissions:
  contents: write

jobs:
  deps:
    name: deps (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-musl
            os: ubuntu-latest
            container: alpine:3.22
            triplet: x64-linux-musl
          - name: macos-arm64
            os: macos-latest
            triplet: arm64-osx
          - name: windows-x64
            os: windows-latest
            triplet: x64-windows-static
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain (Alpine)
        if: ${{ matrix.name == 'linux-musl' }}
        shell: sh
        run: |
          apk add --no-cache build-base cmake ninja git curl zip unzip tar \
                             perl linux-headers bash ca-certificates pkgconf

      - uses: actions/checkout@v4

      # 注意：container job 不会翻译 workflow env 里的路径，VCPKG_BINARY_SOURCES
      # 必须在 step 里用 $GITHUB_WORKSPACE 设置，否则 musl job 的缓存写到容器
      # 里不可见的目录
      - name: Set vcpkg bincache path
        run: echo "VCPKG_BINARY_SOURCES=files,$GITHUB_WORKSPACE/vcpkg-bincache,readwrite" >> "$GITHUB_ENV"

      - name: Enable long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Get vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          git -C .vcpkg rev-parse HEAD > vcpkg-commit.txt
          echo "vcpkg commit: $(cat vcpkg-commit.txt)"

      # 缓存 key 含 vcpkg.json 与当天 vcpkg commit：
      # 上游没更新时缓存命中，整个 job 只花几分钟；上游更新则全量重编并刷新 release
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: deps-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-commit.txt') }}

      - name: Build deps
        run: |
          extra=""
          if [ "${{ matrix.triplet }}" = "x64-linux-musl" ]; then
            extra="-DVCPKG_OVERLAY_TRIPLETS=$PWD/triplets"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} $extra
          cmake --build build

      - name: Pack bincache
        run: tar -czf "vcpkg-bincache-${{ matrix.triplet }}.tar.gz" vcpkg-bincache

      - name: Publish to deps release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deps
          name: Prebuilt vcpkg deps (rolling)
          prerelease: true
          files: |
            vcpkg-bincache-${{ matrix.triplet }}.tar.gz
            vcpkg-commit.txt
